<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}
body{
background:#02133b;
background-image: linear-gradient(135deg,#02133b,#0a2b72,#02133b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.container{
width:100%;
max-width:1000px;
background:white;
border-radius:25px;
padding:40px;
box-shadow:0 0 30px rgba(0,0,0,0.4);
position:relative;
overflow:hidden;
}
.container::before{
content:"";
position:absolute;
inset:0;
background:url('https://www.transparenttextures.com/patterns/wavy.png');
opacity:0.15;
}

.content{
position:relative;
z-index:2;
text-align:center;
}

.logo{
width:220px;
margin-bottom:30px;
}
.title{
font-size:55px;
font-weight:bold;
color:#004b8d;
border:4px solid #004b8d;
display:inline-block;
padding:15px 40px;
border-radius:15px;
margin-bottom:40px;
}

.verify{
font-size:28px;
font-weight:bold;
color:green;
margin-bottom:20px;
}
.name{
font-size:36px;
font-weight:bold;
margin-top:20px;
color:#111;
}

.details{
font-size:22px;
margin-top:15px;
line-height:1.8;
color:#333;
}

.badges{
display:flex;
justify-content:center;
gap:40px;
margin-top:40px;
flex-wrap:wrap;
}
.badges img{
width:130px;
}

.certificate-box{
margin-top:50px;
}

.certificate-box img{
width:100%;
max-width:850px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.id{
margin-top:25px;
font-size:20px;
font-weight:bold;
color:#004b8d;
}
@media(max-width:768px){

.title{
font-size:32px;
padding:12px 20px;
}

.name{
font-size:28px;
}

.details{
font-size:18px;
}

.badges img{
width:90px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="content">

<img class="logo" src="https://i.ibb.co/6N0L9wR/nxtsync-logo.png" alt="logo">

<div class="title">
CERTIFICATE VERIFICATION
</div>

<div class="verify">
✅ VERIFIED SUCCESSFULLY
</div>
<div class="name">
Kingsly Robbin J
</div>

<div class="details">
Successfully completed the <b>Full Stack Web Development Internship</b><br>
Conducted by <b>Nxtsync</b><br>
Duration: 25/03/2025 to 25/03/2026
</div>

<div class="id">
Certificate ID: NX2025FS001
</div>

<div class="badges">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/ISO_9001-2015.svg/800px-ISO_9001-2015.svg.png">

<img src="https://upload.wikimedia.org/wikipedia/en/thumb/1/1f/AICTE_logo.png/220px-AICTE_logo.png">
</div>
<div class="badges">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/ISO_9001-2015.svg/800px-ISO_9001-2015.svg.png">

<img src="https://upload.wikimedia.org/wikipedia/en/thumb/1/1f/AICTE_logo.png/220px-AICTE_logo.png">
</div>

<div class="certificate-box">
<img src="certificate.jpg" alt="certificate">
</div>

</div>

</div>

</body>
</html>
